# =============================================================================
# PettyCash Web CI Pipeline
# Builds and verifies the Web application projects only.
# MAUI mobile builds are excluded until mobile development begins.
# =============================================================================

name: .NET CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build & Verify Web (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK (10.0.x)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore NuGet packages (Web projects only)
        run: dotnet restore PettyCashDatabase.Web/PettyCashDatabase.Web.csproj

      - name: Build Web application (Release)
        run: dotnet build PettyCashDatabase.Web/PettyCashDatabase.Web.csproj --configuration Release --no-restore

      - name: Run Unit Tests (if available)
        run: |
          dotnet test PettyCashDatabase.Web/PettyCashDatabase.Web.csproj --configuration Release --no-build --verbosity normal --logger "trx" || echo "No test projects found."

      - name: Publish Web application
        run: dotnet publish PettyCashDatabase.Web/PettyCashDatabase.Web.csproj --configuration Release --no-build --output ./publish/web

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pettycash-web-build
          path: ./publish/web
          retention-days: 7
